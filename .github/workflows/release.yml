name: Build VPNGate Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -cne $version) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match VERSION '$version'."
          }
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Frontend behavioral checks
        shell: pwsh
        run: |
          pnpm --dir frontend install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed.' }
          pnpm --dir frontend test:vpngate
          if ($LASTEXITCODE -ne 0) { throw 'Frontend behavioral checks failed.' }
      - name: Build verified distribution
        shell: pwsh
        run: ./scripts/build-vpngate.ps1
      - name: Archive
        shell: pwsh
        run: |
          $root = 'build/bin/singbox_vpngate-gui-windows-amd64'
          $files = (Get-Content -Raw "$root/checksums.json" | ConvertFrom-Json).File | ForEach-Object { Join-Path $root $_ }
          Compress-Archive -Path ($files + "$root/checksums.json") -DestinationPath build/bin/SingBox-VPNGate-Desktop-windows-amd64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: SingBox-VPNGate-windows-amd64
          path: build/bin/SingBox-VPNGate-Desktop-windows-amd64.zip
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/bin/SingBox-VPNGate-Desktop-windows-amd64.zip
